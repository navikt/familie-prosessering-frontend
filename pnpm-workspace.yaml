# Flat node_modules (som yarn) slik at prune-backend-node-modules.js og
# Docker-imaget får en resolverbar node_modules-struktur i produksjon.
# Strict/isolated linking legger avhengigheter kun under .pnpm/ uten
# topp-nivå-oppslag, noe som gjør at Node ikke finner f.eks. 'express'
# fra dist_backend/server.js i containeren.
nodeLinker: hoisted
# Avhengigheter får ikke kjøre (pre|post)install-scripts (sikkerhetstiltak).
# Tilsvarer 'ignore-scripts true' som lå i .yarnrc. Ingen av dagens
# avhengigheter har install-scripts; legg til 'pakke: false' her hvis pnpm
# rapporterer "Ignored build scripts" ved en senere install.
allowBuilds: {}
# Egne pakker fra GitHub Packages tas i bruk med en gang (pnpm venter ellers
# minimumReleaseAge, som standard 1 dag, før nye versjoner installeres).
minimumReleaseAgeExclude:
  - '@navikt/*'
  - '@nais/*'
